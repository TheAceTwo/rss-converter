# Deploy with Portainer: Stacks > Add stack > Repository, point it at this repo,
# compose path "docker-compose.yml". Set the variables below under
# "Environment variables". Full steps: docs/DOCKER.md
#
# Ports inside the containers are fixed (feed 5000, panel 5001), same as older
# versions, so existing ProPresenter URLs (http://<docker-host>:5000/rss) and
# tunnel routes keep working. The host side is configurable.

services:
  feed:
    build: .
    command: ["python", "app.py"]
    restart: unless-stopped
    ports:
      - "${FEED_HOST_PORT:-5000}:5000"
    environment:
      XML_URL: ${XML_URL:-}
    volumes:
      - rss-data:/data

  gui:
    build: .
    command: ["python", "gui.py"]
    restart: unless-stopped
    ports:
      - "${GUI_HOST_PORT:-5001}:5001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-}   # optional; blank = random key saved in /data
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      XML_URL: ${XML_URL:-}
    volumes:
      - rss-data:/data
    depends_on:
      - feed

volumes:
  rss-data:
